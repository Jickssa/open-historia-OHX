name: Build Open Historia OHX — Production Fix

on:
  push:
    branches:
      - ohx/3.0.1-final-debug
    paths:
      - "src/**"
      - "mobile/**"
      - "scripts/ohx/**"
      - ".github/workflows/build-ohx-android.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "mobile/**"
      - "scripts/ohx/**"
      - ".github/workflows/build-ohx-android.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      build_variant:
        description: "Android build variant"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current OHX branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies and run full regression suite
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Full repository lint baseline (informational)
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee /tmp/open-historia-full-lint.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::warning::Full repository lint still reports upstream baseline violations; the OHX gate below remains strict."
          fi
          exit 0

      - name: Strict lint for OHX integration
        run: >
          npx eslint
          src/main.jsx
          src/runtime/ohxExpansion.js
          src/runtime/ohxExpansionEngine.js
          src/runtime/ohxExpansionUI.js
          src/runtime/ohxExpansion.test.js
          src/runtime/ohxExpansionEngine.test.js
          scripts/ohx/static-ohx-audit.mjs
          scripts/ohx/core-chat-audit.mjs

      - name: Static OHX race-safety audit
        run: node scripts/ohx/static-ohx-audit.mjs

      - name: Audit native Diplomacy / Conseiller paths
        run: node scripts/ohx/core-chat-audit.mjs

      - name: Build Android web bundle
        env:
          VITE_APP_BUILD: ${{ github.run_number }}
          VITE_APP_TRACK: ohx
        run: npm run build:android

      - name: Make OHX a separate Android application
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('mobile/capacitor.config.json')
          s = p.read_text()
          old = 'io.github.arkniem.paxhistoria"'
          new = 'io.github.arkniem.paxhistoria.ohx"'
          if old not in s:
              raise SystemExit('stable Capacitor application id not found')
          p.write_text(s.replace(old, new))

          p = Path('mobile/android/app/build.gradle')
          s = p.read_text()
          old = 'applicationId ohBeta ? "io.github.arkniem.paxhistoria.beta" : "io.github.arkniem.paxhistoria"'
          new = 'applicationId ohBeta ? "io.github.arkniem.paxhistoria.ohx.beta" : "io.github.arkniem.paxhistoria.ohx"'
          if old not in s:
              raise SystemExit('Android applicationId expression not found')
          s = s.replace(old, new)
          old = 'appLabel: ohBeta ? "Open Historia Beta" : "Open Historia",'
          new = 'appLabel: ohBeta ? "Open Historia OHX Beta" : "Open Historia OHX",'
          if old not in s:
              raise SystemExit('Android label expression not found')
          p.write_text(s.replace(old, new))
          PY

      - name: Restore map-data cache
        uses: actions/cache@v4
        with:
          path: mobile/map-cache
          key: ohx-map-data-${{ hashFiles('mobile/map-assets.android.json') }}

      - name: Build Android web assets
        working-directory: mobile
        run: |
          set -euo pipefail
          npm ci
          npm run map
          npm run www
          npx cap sync android

      - name: Assemble Android APK
        working-directory: mobile/android
        env:
          OH_ANDROID_BUILD: ${{ github.run_number }}
          VITE_APP_BUILD: ${{ github.run_number }}
          VITE_APP_TRACK: ohx
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [[ "${{ inputs.build_variant || 'debug' }}" == "release" ]]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Stage and verify APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/ohx-apk
          if [[ "${{ inputs.build_variant || 'debug' }}" == "release" ]]; then
            apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          else
            apk="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -f "$apk"
          test "$(stat -c '%s' "$apk")" -gt 10000000
          cp "$apk" dist/ohx-apk/open-historia-ohx.apk
          (cd dist/ohx-apk && sha256sum open-historia-ohx.apk | tee open-historia-ohx.apk.sha256)
          unzip -t dist/ohx-apk/open-historia-ohx.apk >/tmp/ohx-apk-unzip-test.txt
          cat /tmp/ohx-apk-unzip-test.txt
          ls -lh dist/ohx-apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v6
        with:
          name: open-historia-ohx
          path: dist/ohx-apk/*
          retention-days: 14
