name: Build Open Historia OHX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_SHA: 0eec087ce7bad0ec39937c33743a147d82477d94
      UPSTREAM_REPO: Open-Historia/open-historia
    steps:
      - name: Checkout fork workspace (contains OHX kit)
        uses: actions/checkout@v5

      - name: Refuse stale upstream base
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" refs/heads/main | awk '{print $1}')"
          test -n "$current"
          echo "Pinned base: $BASE_SHA"
          echo "Upstream main: $current"
          if [ "$current" != "$BASE_SHA" ]; then
            echo "::error::Upstream main moved. This reproducible OHX kit must be regenerated/rebased before building."
            exit 1
          fi

      - name: Fetch exact Open Historia reference archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src /tmp/open-historia-ohx.tar.gz
          mkdir -p build-src
          curl -L --fail --retry 3 --retry-delay 2 \
            -o /tmp/open-historia-ohx.tar.gz \
            "https://github.com/${UPSTREAM_REPO}/archive/${BASE_SHA}.tar.gz"
          tar -xzf /tmp/open-historia-ohx.tar.gz --strip-components=1 -C build-src
          test -f build-src/package.json
          test -f .ohx/ohx_expansion.patch

      - name: Verify and apply OHX patch to reference source
        shell: bash
        run: |
          set -euo pipefail
          cp .ohx/ohx_expansion.patch build-src/.ohx_expansion.patch
          cd build-src
          git init -q
          git add -A
          git -c user.name=OHX -c user.email=ohx@example.invalid commit -qm "Reference base"
          git apply --check .ohx_expansion.patch
          git apply .ohx_expansion.patch
          test -f src/runtime/ohxExpansion.js
          test -f src/runtime/ohxExpansionEngine.js
          test -f src/runtime/ohxExpansionUI.js

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: build-src/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify source
        working-directory: build-src
        run: |
          npm ci
          npm test

      - name: Make OHX a separate Android app
        working-directory: build-src
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('mobile/capacitor.config.json')
          s = p.read_text()
          old = 'io.github.arkniem.paxhistoria"'
          new = 'io.github.arkniem.paxhistoria.ohx"'
          if old not in s:
              raise SystemExit('stable Capacitor app id not found')
          p.write_text(s.replace(old, new))

          p = Path('mobile/android/app/build.gradle')
          s = p.read_text()
          old = 'applicationId ohBeta ? "io.github.arkniem.paxhistoria.beta" : "io.github.arkniem.paxhistoria"'
          new = 'applicationId ohBeta ? "io.github.arkniem.paxhistoria.ohx.beta" : "io.github.arkniem.paxhistoria.ohx"'
          if old not in s:
              raise SystemExit('Android applicationId expression not found')
          s = s.replace(old, new)
          old = 'appLabel: ohBeta ? "Open Historia Beta" : "Open Historia",'
          new = 'appLabel: ohBeta ? "Open Historia OHX Beta" : "Open Historia OHX",'
          if old not in s:
              raise SystemExit('Android label expression not found')
          p.write_text(s.replace(old, new))
          PY
          grep -q 'io.github.arkniem.paxhistoria.ohx"' mobile/capacitor.config.json
          grep -q 'io.github.arkniem.paxhistoria.ohx"' mobile/android/app/build.gradle

      - name: Build Android web bundle
        working-directory: build-src
        env:
          VITE_APP_BUILD: ${{ github.run_number }}
          # `ohx` is intentionally NOT registered in the official update feed.
          # That makes the APK's update check return an empty manifest instead of
          # advertising an incompatible stable/beta APK.
          VITE_APP_TRACK: ohx
        run: npm run build:android

      - name: Restore map-data cache
        uses: actions/cache@v4
        with:
          path: build-src/mobile/map-cache
          key: ohx-map-data-${{ hashFiles('build-src/mobile/map-assets.android.json') }}

      - name: Build installable debug APK
        working-directory: build-src/mobile
        env:
          OH_ANDROID_BUILD: ${{ github.run_number }}
          VITE_APP_BUILD: ${{ github.run_number }}
          VITE_APP_TRACK: ohx
        run: |
          npm ci
          npm run map
          npm run www
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK into artifact staging path
        shell: bash
        run: |
          set -euo pipefail
          apk="build-src/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          cp "$apk" open-historia-ohx.apk
          ls -lh open-historia-ohx.apk
          sha256sum open-historia-ohx.apk | tee open-historia-ohx.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: open-historia-ohx
          path: |
            open-historia-ohx.apk
            open-historia-ohx.apk.sha256
          retention-days: 14
